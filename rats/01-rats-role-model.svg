<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1E2761" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="420" fill="#FFFFFF"/>

  <!-- Container: GEC -->
  <rect x="40" y="140" width="260" height="220" rx="14" fill="#FFFFFF" stroke="#1E2761" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="65" y="170" font-size="19" font-weight="700" fill="#1E2761">GEC</text>

  <rect x="65" y="185" width="210" height="65" rx="8" fill="#CADCFC" stroke="#1E2761" stroke-width="1"/>
  <text x="170" y="211" font-size="15" font-weight="700" fill="#1E2761" text-anchor="middle">Hardware root</text>
  <text x="170" y="232" font-size="12.5" fill="#3C4869" text-anchor="middle">TPM or HSM</text>

  <line x1="170" y1="250" x2="170" y2="265" stroke="#1E2761" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="65" y="270" width="210" height="65" rx="8" fill="#F4F6FC" stroke="#1E2761" stroke-width="1"/>
  <text x="170" y="296" font-size="15" font-weight="700" fill="#1E2761" text-anchor="middle">GEC kernel</text>
  <text x="170" y="317" font-size="12.5" fill="#3C4869" text-anchor="middle">Then signs the event log itself</text>

  <!-- Endorser -->
  <rect x="360" y="40" width="190" height="65" rx="8" fill="#F4F6FC" stroke="#5B5F76" stroke-width="1"/>
  <text x="455" y="66" font-size="15" font-weight="700" fill="#1E2761" text-anchor="middle">Operator cert</text>
  <text x="455" y="87" font-size="12.5" fill="#5B5F76" text-anchor="middle">Endorses the GEC key</text>
  <line x1="455" y1="105" x2="455" y2="148" stroke="#5B5F76" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Verifier -->
  <rect x="340" y="150" width="230" height="90" rx="8" fill="#1E2761"/>
  <text x="455" y="188" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">KIA verifier</text>
  <text x="455" y="211" font-size="13" fill="#CADCFC" text-anchor="middle">Appraises the manifest</text>

  <!-- Arrows between container / verifier / relying party -->
  <line x1="300" y1="240" x2="335" y2="240" stroke="#1E2761" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="240" x2="605" y2="240" stroke="#1E2761" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Relying Party -->
  <rect x="610" y="150" width="250" height="90" rx="8" fill="#CADCFC" stroke="#1E2761" stroke-width="1"/>
  <text x="735" y="188" font-size="16" font-weight="700" fill="#1E2761" text-anchor="middle">GAR, other GECs</text>
  <text x="735" y="211" font-size="13" fill="#3C4869" text-anchor="middle">Trust decision, audit record</text>

  <text x="450" y="400" font-size="12.5" fill="#5B5F76" text-anchor="middle">Figure 1 — KIA's roles mapped onto RFC 9334's Attester / Endorser / Verifier / Relying Party model</text>
</svg>
