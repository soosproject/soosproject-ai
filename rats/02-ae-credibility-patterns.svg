<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1E2761" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="300" fill="#FFFFFF"/>

  <text x="220" y="50" font-size="18" font-weight="700" fill="#1E2761" text-anchor="middle">Observation model</text>
  <rect x="80" y="75" width="280" height="60" rx="8" fill="#F4F6FC" stroke="#5B5F76" stroke-width="1"/>
  <text x="220" y="100" font-size="15" font-weight="700" fill="#1E2761" text-anchor="middle">Target environment</text>
  <text x="220" y="120" font-size="12.5" fill="#5B5F76" text-anchor="middle">State exists on its own</text>

  <line x1="220" y1="135" x2="220" y2="185" stroke="#1E2761" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow2)"/>
  <text x="238" y="163" font-size="12.5" fill="#3C4869" text-anchor="start">reads / measures</text>

  <rect x="80" y="185" width="280" height="60" rx="8" fill="#CADCFC" stroke="#1E2761" stroke-width="1"/>
  <text x="220" y="210" font-size="15" font-weight="700" fill="#1E2761" text-anchor="middle">Attesting environment</text>
  <text x="220" y="230" font-size="12.5" fill="#3C4869" text-anchor="middle">Reports what it observed</text>

  <text x="680" y="50" font-size="18" font-weight="700" fill="#1E2761" text-anchor="middle">Control model</text>
  <rect x="540" y="75" width="280" height="60" rx="8" fill="#CADCFC" stroke="#1E2761" stroke-width="1"/>
  <text x="680" y="100" font-size="15" font-weight="700" fill="#1E2761" text-anchor="middle">Attesting environment</text>
  <text x="680" y="120" font-size="12.5" fill="#3C4869" text-anchor="middle">Owns the update path</text>

  <line x1="680" y1="135" x2="680" y2="185" stroke="#1E2761" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="698" y="163" font-size="12.5" fill="#3C4869" text-anchor="start">controls / updates</text>

  <rect x="540" y="185" width="280" height="60" rx="8" fill="#F4F6FC" stroke="#5B5F76" stroke-width="1"/>
  <text x="680" y="210" font-size="15" font-weight="700" fill="#1E2761" text-anchor="middle">Target environment</text>
  <text x="680" y="230" font-size="12.5" fill="#5B5F76" text-anchor="middle">Can't change without AE</text>

  <text x="450" y="280" font-size="12.5" fill="#5B5F76" text-anchor="middle">Figure 2 — Two RFC 9334-grounded bases for an Attesting Environment's credibility</text>
</svg>
